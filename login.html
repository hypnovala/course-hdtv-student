<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HDTV — Student Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height: 100vh;
      background: #0a0a0a;
      font-family: 'DM Sans', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201,168,76,0.07) 0%, transparent 65%);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #111318;
      border: 1px solid #1e2535;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .card::before {
      content: '';
      display: block;
      height: 3px;
      background: linear-gradient(90deg, #8b6b20, #c9a84c, #8b6b20);
    }

    .card-header {
      padding: 36px 40px 28px;
      text-align: center;
      border-bottom: 1px solid #1e2535;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #c9a84c, #8b6b20);
      border-radius: 10px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 22px; font-weight: 700;
      color: #000;
      margin-bottom: 16px;
    }

    .brand {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: #c9a84c; display: block; margin-bottom: 3px;
    }

    .brand-sub {
      font-size: 11px; letter-spacing: 0.14em;
      text-transform: uppercase; color: #3a4060;
    }

    .card-body { padding: 36px 40px 40px; }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px; font-weight: 700;
      color: #f5f2ec; line-height: 1.15;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px; color: #7a8099;
      line-height: 1.6; margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: #7a8099; margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      background: #0a0c12;
      border: 1px solid #1e2535;
      border-radius: 5px;
      color: #f5f2ec;
      font-family: 'DM Sans', Arial, sans-serif;
      font-size: 18px;
      letter-spacing: 0.12em;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }

    input[type="password"]::placeholder { color: #3a4060; letter-spacing: 0.04em; font-size: 14px; }
    input[type="password"]:focus { border-color: rgba(201,168,76,0.5); }

    button[type="submit"] {
      width: 100%;
      background: #c9a84c;
      color: #000;
      border: none;
      border-radius: 5px;
      font-family: 'DM Sans', Arial, sans-serif;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 16px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    button[type="submit"]:hover { background: #e8c97a; transform: translateY(-1px); }
    button[type="submit"]:disabled { background: #4a3f1e; color: #6b5820; cursor: not-allowed; transform: none; }

    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .msg {
      display: none;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 14px;
      text-align: center;
    }

    .msg.error {
      background: rgba(180,40,40,0.1);
      border: 1px solid rgba(180,40,40,0.3);
      color: #e07070;
    }

    .divider { height: 1px; background: #1e2535; margin: 28px 0; }

    .help-text {
      font-size: 12px; color: #3a4060;
      text-align: center; line-height: 1.7;
    }

    .help-text a { color: #c9a84c; text-decoration: none; }

    @media (max-width: 480px) {
      .card-header, .card-body { padding-left: 24px; padding-right: 24px; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="logo-badge">HD</div>
    <span class="brand">HypnoticDream TV</span>
    <span class="brand-sub">Student Portal</span>
  </div>

  <div class="card-body">
    <h1>Enter Your<br>Access Password</h1>
    <p class="subtitle">Your password was included in your welcome email. Enter it below to unlock your course.</p>

    <form id="loginForm">
      <label for="password">Course Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter password"
        required
        autocomplete="current-password"
      />
      <button type="submit" id="submitBtn">
        <span id="btnText">Access My Course</span>
        <span class="spinner" id="spinner"></span>
      </button>
    </form>

    <div class="msg error" id="errorMsg"></div>

    <div class="divider"></div>

    <p class="help-text">
      Need your password? Check your enrollment email.<br>
      Still need help? <a href="mailto:hypnoticalstv@gmail.com">hypnoticalstv@gmail.com</a>
    </p>
  </div>
</div>

<script>
  // If already logged in, skip to course
  (async () => {
    try {
      const res = await fetch('/api/session');
      const data = await res.json();
      if (data.loggedIn) window.location.href = '/';
    } catch {}
  })();

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const errorMsg = document.getElementById('errorMsg');

    errorMsg.style.display = 'none';
    btn.disabled = true;
    btnText.style.display = 'none';
    spinner.style.display = 'block';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });

      const data = await res.json();

      if (data.success) {
        window.location.href = '/';
      } else {
        errorMsg.textContent = data.error || 'Incorrect password. Please try again.';
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
      }
    } catch {
      errorMsg.textContent = 'Connection error. Please try again.';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btnText.style.display = 'inline';
      spinner.style.display = 'none';
    }
  });
</script>

</body>
</html>
